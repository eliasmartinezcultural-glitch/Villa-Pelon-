name: Villa Pelón smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/villa-pelon-server.log 2>&1 &
      - name: Execute browser smoke test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/index.html?v=95.7',{waitUntil:'networkidle'});
            await page.waitForTimeout(3000);
            for(let i=0;i<4;i++){
              const b=page.locator('[data-intro-next]');
              if(await b.isVisible()) await b.click();
              await page.waitForTimeout(100);
            }
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>({health:window.VillaPelon?.health,integrity:window.VillaPelon?.integrity,game:window.VillaPelon?.gameState,people:window.VillaPelon?.peopleVehicles,render:window.VillaPelon?.renderCompositor,detail:window.VillaPelon?.buildingDetail,stability:window.VillaPelon?.stability,world:window.VillaPelon?.world,geometry:window.VillaPelon?.worldGeometry}));
            if(!state.health?.ok) throw new Error('Healthcheck failed: '+JSON.stringify(state.health));
            if(!state.integrity?.ok) throw new Error('Integrity failed: '+JSON.stringify(state.integrity));
            if(!state.game?.started) throw new Error('Game did not start');
            if(!state.render?.singleRAF) throw new Error('Render compositor missing');
            if(state.people?.npcOverlay!==false) throw new Error('NPC overlay duplication risk');
            if(!state.detail?.distinctive) throw new Error('Building identity layer missing');
            if(state.stability?.version!=='95.1') throw new Error('Stability gate missing');
            if(state.world?.w!==8200||state.world?.h!==4200) throw new Error('World size mismatch');
            if(!state.geometry?.routes?.some(r=>r?.id==='picada21_route')) throw new Error('Picada 21 route missing');
            if(document.getElementById('detailLayer')) throw new Error('Legacy detail renderer still mounted');

            /* VERGEL contract: E must harvest when inside a valid zone. */
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.x=5350;s.y=2430;s.energy=100;s.dialogue=false;s.inventory=[]});
            const beforeVergel=await page.evaluate(()=>({energy:window.VillaPelon.gameState.energy,inventory:[...window.VillaPelon.gameState.inventory]}));
            await page.keyboard.press('e');
            await page.waitForTimeout(100);
            const afterVergel=await page.evaluate(()=>({energy:window.VillaPelon.gameState.energy,inventory:[...window.VillaPelon.gameState.inventory]}));
            if(afterVergel.energy!==beforeVergel.energy-4) throw new Error('VERGEL interaction priority failed: '+JSON.stringify({beforeVergel,afterVergel}));
            if(!afterVergel.inventory.includes('verduras')) throw new Error('VERGEL harvest did not enter inventory');

            await page.keyboard.down('ArrowRight'); await page.waitForTimeout(500); await page.keyboard.up('ArrowRight');
            const after=await page.evaluate(()=>window.VillaPelon.gameState.x);
            if(after===5350) throw new Error('Player did not move');
            await page.locator('#save').click();
            await page.waitForTimeout(100);
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('villa_pelon_save')||'null'));
            if(!saved) throw new Error('Save missing');
            await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(3000);
            const restored=await page.evaluate(()=>({x:window.VillaPelon?.gameState?.x,savedAt:window.VillaPelon?.gameState?.savedAt,health:window.VillaPelon?.health,integrity:window.VillaPelon?.integrity}));
            if(Math.abs((restored.x??NaN)-after)>0.01) throw new Error('Save/reload position mismatch');
            if(!restored.health?.ok||!restored.integrity?.ok) throw new Error('Post-reload health/integrity failed');
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await page.screenshot({path:'villa-pelon-smoke.png',fullPage:true});
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const mobileErrors=[];mobile.on('pageerror',e=>mobileErrors.push(e.message));mobile.on('console',m=>{if(m.type()==='error')mobileErrors.push(m.text())});
            await mobile.goto('http://127.0.0.1:4173/index.html?v=95.7',{waitUntil:'networkidle'});await mobile.waitForTimeout(2500);
            const mobileState=await mobile.evaluate(()=>({started:!!window.VillaPelon?.gameState?.started,health:window.VillaPelon?.health?.ok,integrity:window.VillaPelon?.integrity?.ok,canvas:!!document.getElementById('world'),legacyDetail:!!document.getElementById('detailLayer')}));
            if(!mobileState.started||!mobileState.health||!mobileState.integrity||!mobileState.canvas||mobileState.legacyDetail) throw new Error('Mobile smoke failed: '+JSON.stringify(mobileState));
            if(mobileErrors.length) throw new Error('Mobile browser errors: '+mobileErrors.join(' | '));
            await mobile.close();
            console.log('VILLA PELON SMOKE OK',JSON.stringify({after,restored,mobileState,health:state.health,integrity:state.integrity,route:'picada21_route',vergel:'harvest_ok'}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villa-pelon-smoke
          path: villa-pelon-smoke.png
          if-no-files-found: ignore
