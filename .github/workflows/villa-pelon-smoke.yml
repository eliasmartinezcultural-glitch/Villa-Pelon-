name: Villa Pelón smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/villa-pelon-server.log 2>&1 &
      - name: Execute browser smoke test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/index.html?v=106.8',{waitUntil:'networkidle'});
            await page.waitForTimeout(3000);
            for(let i=0;i<4;i++){const b=page.locator('[data-intro-next]');if(await b.isVisible()) await b.click();await page.waitForTimeout(100)}
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>({health:window.VillaPelon?.health,integrity:window.VillaPelon?.integrity,game:window.VillaPelon?.gameState,people:window.VillaPelon?.peopleVehicles,render:window.VillaPelon?.renderCompositor,detail:window.VillaPelon?.buildingDetail,stability:window.VillaPelon?.stability,world:window.VillaPelon?.world,geometry:window.VillaPelon?.worldGeometry,engine:window.VillaPelon?.engine,architecture:window.VillaPelon?.architectureContract}));
            if(!state.health?.ok) throw new Error('Healthcheck failed: '+JSON.stringify(state.health));
            if(!state.integrity?.ok) throw new Error('Integrity failed: '+JSON.stringify(state.integrity));
            if(!state.game?.started) throw new Error('Game did not start');
            if(!state.render?.singleRAF) throw new Error('Render compositor missing');
            if(state.people?.npcOverlay!==false) throw new Error('NPC overlay duplication risk');
            if(!state.detail?.distinctive) throw new Error('Building identity layer missing');
            if(state.stability?.version!=='95.1') throw new Error('Stability gate missing');
            if(state.world?.w!==8200||state.world?.h!==4200||state.world?.version!=='106.4') throw new Error('World authority mismatch');
            if(!state.geometry?.routes?.some(r=>r?.id==='picada21_route')) throw new Error('Picada 21 route missing');
            if(state.integrity?.buildingOverlaps?.length) throw new Error('Building overlaps: '+JSON.stringify(state.integrity.buildingOverlaps));
            if(state.engine?.health?.().singleBuildingRenderer!==true) throw new Error('Duplicate building renderer risk');
            if(state.engine?.health?.().npcNavigation!=='bridge-aware') throw new Error('NPC navigation contract missing');
            if(state.architecture?.singleBuildingRenderer!==true) throw new Error('Architecture contract missing');
            if(state.architecture?.buildingRendererOwner!=='render_compositor_v93') throw new Error('Renderer authority mismatch');
            if(state.architecture?.version!=='106.6') throw new Error('Architecture contract version mismatch');
            if(state.architecture?.worldRules!==true||state.architecture?.worldAuthority!==true) throw new Error('World-law authority contract missing');
            if(!state.geometry?.geometryContract?.noBuildingOnRoads||!state.geometry?.geometryContract?.noBuildingInRiver) throw new Error('Geometry contract missing');
            if(document.getElementById('detailLayer')) throw new Error('Legacy detail renderer still mounted');
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.x=5350;s.y=2430;s.energy=100;s.dialogue=false;s.inventory=[]});
            const beforeVergel=await page.evaluate(()=>({energy:window.VillaPelon.gameState.energy,inventory:[...window.VillaPelon.gameState.inventory]}));
            await page.keyboard.press('e'); await page.waitForTimeout(100);
            const afterVergel=await page.evaluate(()=>({energy:window.VillaPelon.gameState.energy,inventory:[...window.VillaPelon.gameState.inventory]}));
            if(afterVergel.energy!==beforeVergel.energy-4||!afterVergel.inventory.includes('verduras')) throw new Error('VERGEL contract failed: '+JSON.stringify({beforeVergel,afterVergel}));
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.missionId='name_01';s.missionStep=0;s.missionFlags={};s.missionHistory=[];s.flags={};s.inventory=[];s.dialogue=false;s.x=1550;s.y=1150});
            await page.keyboard.press('e'); await page.waitForTimeout(120);
            const celso=await page.evaluate(()=>({id:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep,dialogue:window.VillaPelon.gameState.dialogue}));
            if(celso.id!=='name_01'||celso.step!==1||!celso.dialogue) throw new Error('Historical NPC mission failed: '+JSON.stringify(celso));
            for(let i=0;i<4;i++){await page.keyboard.press('e');await page.waitForTimeout(30)}
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.x=1500;s.y=470;s.dialogue=false});
            await page.keyboard.press('e'); await page.waitForTimeout(120);
            const topo=await page.evaluate(()=>({id:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep,history:window.VillaPelon.gameState.missionHistory.map(x=>x.id)}));
            if(topo.id!=='community_01'||topo.step!==0||!topo.history.includes('name_01')) throw new Error('Toponym mission failed: '+JSON.stringify(topo));
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.missionId='dni_01';s.missionStep=0;s.missionFlags={};s.flags={};s.inventory=[];s.dialogue=false;s.x=1280;s.y=470});
            await page.keyboard.press('e'); await page.waitForTimeout(120);
            const dni=await page.evaluate(()=>({missionId:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep,inventory:[...window.VillaPelon.gameState.inventory]}));
            if(dni.missionId!=='dni_01'||dni.step!==1||!dni.inventory.includes('DNI extraviado')) throw new Error('DNI pickup failed: '+JSON.stringify(dni));
            await page.evaluate(()=>{const s=window.VillaPelon.gameState;s.x=7600;s.y=2250;s.dialogue=false}); await page.waitForTimeout(150);
            const reached=await page.evaluate(()=>({missionId:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep}));
            if(reached.missionId!=='dni_01'||reached.step!==2) throw new Error('Picada 21 reach objective failed: '+JSON.stringify(reached));
            await page.keyboard.press('e'); await page.waitForTimeout(120);
            const delivered=await page.evaluate(()=>({missionId:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep,inventory:[...window.VillaPelon.gameState.inventory],dialogue:window.VillaPelon.gameState.dialogue}));
            if(delivered.missionId!=='picada21_memory'||delivered.step!==0||delivered.inventory.includes('DNI extraviado')||!delivered.dialogue) throw new Error('DNI delivery event failed: '+JSON.stringify(delivered));
            for(let i=0;i<6;i++){await page.keyboard.press('e');await page.waitForTimeout(40)} await page.keyboard.press('e'); await page.waitForTimeout(120);
            const memory=await page.evaluate(()=>({missionId:window.VillaPelon.gameState.missionId,step:window.VillaPelon.gameState.missionStep,history:window.VillaPelon.gameState.missionHistory.map(x=>x.id)}));
            if(memory.missionId!=='founding_01'||memory.step!==0||!memory.history.includes('dni_01')||!memory.history.includes('picada21_memory')) throw new Error('Picada 21 memory chain failed: '+JSON.stringify(memory));
            await page.locator('#save').click(); await page.waitForTimeout(100);
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('villa_pelon_save')||'null'));
            if(!saved||saved.missionId!=='founding_01') throw new Error('Mission progression not included in save');
            await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(3000);
            const restored=await page.evaluate(()=>({x:window.VillaPelon?.gameState?.x,savedAt:window.VillaPelon?.gameState?.savedAt,missionId:window.VillaPelon?.gameState?.missionId,health:window.VillaPelon?.health,integrity:window.VillaPelon?.integrity}));
            if(restored.missionId!=='founding_01') throw new Error('Mission save/reload mismatch: '+JSON.stringify(restored));
            if(!restored.health?.ok||!restored.integrity?.ok) throw new Error('Post-reload health/integrity failed');
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await page.screenshot({path:'villa-pelon-smoke.png',fullPage:true});
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const mobileErrors=[];mobile.on('pageerror',e=>mobileErrors.push(e.message));mobile.on('console',m=>{if(m.type()==='error')mobileErrors.push(m.text())});
            await mobile.goto('http://127.0.0.1:4173/index.html?v=106.8',{waitUntil:'networkidle'});await mobile.waitForTimeout(2500);
            const mobileState=await mobile.evaluate(()=>({started:!!window.VillaPelon?.gameState?.started,health:window.VillaPelon?.health?.ok,integrity:window.VillaPelon?.integrity?.ok,canvas:!!document.getElementById('world'),legacyDetail:!!document.getElementById('detailLayer')}));
            if(!mobileState.started||!mobileState.health||!mobileState.integrity||!mobileState.canvas||mobileState.legacyDetail) throw new Error('Mobile smoke failed: '+JSON.stringify(mobileState));
            if(mobileErrors.length) throw new Error('Mobile browser errors: '+mobileErrors.join(' | '));
            await mobile.close();
            console.log('VILLA PELON SMOKE OK',JSON.stringify({restored,mobileState,integrity:state.integrity,route:'picada21_route',vergel:'harvest_ok',campaign:'historical_97_ok',singleBuildingRenderer:true,architectureContract:state.architecture?.version,npcNavigation:'bridge-aware'}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villa-pelon-smoke
          path: villa-pelon-smoke.png
          if-no-files-found: ignore
