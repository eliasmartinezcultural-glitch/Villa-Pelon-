<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#294d38">
<meta name="description" content="Villa Pelón — RPG 2D pixel rural de mundo vivo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest?v=60">
<title>Villa Pelón · RPG Pixel</title>
<link rel="stylesheet" href="./style.css?v=60">
<link rel="stylesheet" href="./v48_intro.css?v=60">
</head>
<body>
<main id="app">
<section id="start" class="screen intro-screen">
  <div class="title-card">
    <div class="eyebrow">VILLA PELÓN</div>
    <h1>DONDE COMIENZA UNA HISTORIA</h1>
    <p id="introText">En un pequeño pueblo, cada calle guarda una historia. Cada casa conserva una memoria. Cada persona forma parte de una vida que continúa día tras día.</p>
    <button id="startBtn" type="button">COMENZAR</button>
  </div>
</section>
<section id="game" class="hidden">
  <header class="hud"><strong>VILLA PELÓN</strong><span>🕐 <b id="clock">08:00</b></span><span>📅 Día <b id="day">1</b></span><span>🌤️ <b id="weather">Despejado</b></span><span>💰 $<b id="money">10000</b></span><span>⚡ <b id="energy">100</b></span></header>
  <canvas id="world" aria-label="Villa Pelón: exploración libre, calles, río y pueblo vivo"></canvas>
  <div class="quest"><b>MISIÓN</b><span id="questText">Conocé a un vecino.</span></div>
  <div id="dialogue" class="dialogue hidden"><div id="speaker"></div><div id="dialogueText"></div><button id="dialogueNext" type="button">CONTINUAR</button></div>
  <div class="touch" aria-label="Controles de movimiento">
    <button data-key="up" type="button" aria-label="Mover arriba">▲</button>
    <div><button data-key="left" type="button" aria-label="Mover izquierda">◀</button><button data-key="down" type="button" aria-label="Mover abajo">▼</button><button data-key="right" type="button" aria-label="Mover derecha">▶</button></div>
    <button id="interact" type="button" aria-label="Interactuar">E</button>
  </div>
  <button id="save" class="save" type="button">GUARDAR</button>
</section>
</main>
<script src="./village_data.js?v=60" defer></script>
<script src="./core/runtime.js?v=60" defer></script>
<script src="./life.js?v=60" defer></script>
<script src="./game.js?v=60" defer></script>
<script src="./v57_integrity.js?v=60" defer></script>
<script src="./v50_version_badge.js?v=60" defer></script>
<script src="./v55_runtime_integrator.js?v=60" defer></script>
<script src="./controls.js?v=60" defer></script>
</body>
</html>
