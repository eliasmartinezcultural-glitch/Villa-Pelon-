<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#294d38"><meta name="description" content="Villa Pelón — Historia Viva, RPG 2D pixel art."><link rel="stylesheet" href="./style.css?v=90.1"><style>body{overflow:hidden;background:#16231b}.intro-screen{display:none!important}.story-intro{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,18,14,.58);backdrop-filter:blur(2px)}.story-intro.hidden{display:none}.story-card{width:min(620px,92vw);padding:28px;border:3px solid #c8a86a;background:#1d2d22;box-shadow:0 18px 50px rgba(0,0,0,.45);color:#f4ead2}.story-kicker{font:700 11px monospace;letter-spacing:.14em;opacity:.75}.story-card h2{margin:10px 0 12px;font:700 clamp(22px,5vw,38px) monospace}.story-card p{margin:0 0 22px;font:16px/1.55 system-ui,sans-serif;color:#e9dfc7}.story-next{border:0;padding:12px 18px;background:#c8a86a;color:#1b241c;font-weight:800;cursor:pointer}.vp-boot{position:fixed;inset:0;z-index:10000;background:#16231b;color:#f4ead2;display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif}.vp-boot.hidden{display:none!important}#missionToast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:9500;padding:10px 16px;border:2px solid #c8a86a;background:#1d2d22;color:#f4ead2;font:700 12px monospace;transition:.22s ease;max-width:90vw;text-align:center}.missionToast.show{opacity:1;transform:translate(-50%,0)}canvas{image-rendering:pixelated}.quest{z-index:15}.quest small{display:block;opacity:.7;margin-top:3px}.vp-panel button{border:2px solid #c8a86a;background:#c8a86a;color:#1b241c;padding:8px 10px;font-weight:800}#worldDetail{display:none!important}</style></head><body><div class="vp-boot" id="bootScreen">VILLA PELÓN · INICIANDO EL MUNDO…</div><main id="app"><section id="start" class="intro-screen"></section><section id="game"><header class="hud"><strong>VILLA PELÓN</strong><span>🕐 <b id="clock">08:00</b></span><span>📅 Día <b id="day">1</b></span><span>🌤️ <b id="weather">Despejado</b></span><span>💰 $<b id="money">10000</b></span><span>⚡ <b id="energy">100</b></span><span>🌱 <b id="vergelStatus">VERGEL</b></span></header><canvas id="world" aria-label="Villa Pelón: exploración libre"></canvas><canvas id="worldDetail" aria-hidden="true"></canvas><div class="quest"><b>MISIÓN</b><span id="questText">Cargando objetivo…</span><small id="questProgress"></small></div><div id="dialogue" class="dialogue hidden"><div id="speaker"></div><div id="dialogueText"></div><button id="dialogueNext" type="button">CONTINUAR</button></div><div class="touch" aria-label="Controles"><div class="touch-dpad"><button data-key="up" type="button">▲</button><button data-key="left" type="button">◀</button><button data-key="down" type="button">▼</button><button data-key="right" type="button">▶</button></div><button id="interact" type="button">E</button></div><button id="save" class="save" type="button">GUARDAR</button></section></main><div id="missionToast" class="missionToast" aria-live="polite"></div><section id="storyIntro" class="story-intro hidden"><div class="story-card"><div class="story-kicker">VILLA PELÓN · HISTORIA VIVA</div><h2 data-intro-title></h2><p data-intro-text></p><button class="story-next" data-intro-next>CONTINUAR</button></div></section><script src="./village_data.js?v=90.1" defer></script><script src="./core/runtime.js?v=90.1" defer></script><script src="./core/world_manifest.js?v=90.1" defer></script><script src="./core/world_expansion_v88.js?v=90.1" defer></script><script src="./core/world_vergel_v90.js?v=90.1" defer></script><script src="./core/mission_system.js?v=90.1" defer></script><script src="./core/v90_engine.js?v=90.1" defer></script><script src="./core/integration_v90.js?v=90.1" defer></script><script src="./core/mission_runtime.js?v=90.1" defer></script><script src="./core/presentation_runtime.js?v=90.1" defer></script><script src="./core/interface_v88.js?v=90.1" defer></script><script src="./core/soft_intro.js?v=90.1" defer></script><script>window.addEventListener('villa-pelon-engine-ready',()=>document.getElementById('bootScreen')?.classList.add('hidden'));setTimeout(()=>document.getElementById('bootScreen')?.classList.add('hidden'),2500);setInterval(()=>{const v=window.VillaPelon?.vergel,s=document.getElementById('vergelStatus');if(v&&s)s.textContent='VERGEL · '+String(v.season||'activo').toUpperCase()},700);window.addEventListener('villa-pelon-mission',e=>{const s=e.detail?.mission;if(s){const q=document.getElementById('questText'),p=document.getElementById('questProgress');if(q)q.textContent=s.objective||s.title;if(p)p.textContent='Paso '+(s.step+1)+' de '+s.total+' · Recompensa $'+s.reward}});</script></body></html>
