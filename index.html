<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#243b2a">
<meta name="description" content="Villa Pelón — RPG educativo sobre San Patricio del Chañar">
<title>Villa Pelón</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="start" class="screen">
    <div class="title-card">
      <div class="eyebrow">SAN PATRICIO DEL CHAÑAR · NEUQUÉN</div>
      <h1>VILLA PELÓN</h1>
      <p>Un pueblo para vivir, explorar y descubrir.</p>
      <button id="startBtn">COMENZAR</button>
    </div>
  </section>
  <section id="game" class="hidden">
    <header class="hud">
      <strong>VILLA PELÓN</strong>
      <span id="clock">08:00</span>
      <span>💰 $<b id="money">10000</b></span>
      <span>⚡ <b id="energy">100</b></span>
    </header>
    <canvas id="world"></canvas>
    <div id="dialogue" class="dialogue hidden">
      <div id="speaker"></div><div id="dialogueText"></div>
      <button id="dialogueNext">CONTINUAR</button>
    </div>
    <div class="quest"><b>MISIÓN</b><span id="questText">Conocé a un vecino.</span></div>
    <div class="touch">
      <button data-key="up">▲</button>
      <div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
      <button id="interact">E</button>
    </div>
    <button id="save" class="save">GUARDAR</button>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
