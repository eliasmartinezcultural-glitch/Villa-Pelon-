<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#294d38"><meta name="description" content="Villa Pelón — Historia Viva, RPG 2D pixel art."><link rel="stylesheet" href="./style.css?v=86"><style>
body{overflow:hidden;background:#16231b}.intro-screen{display:none!important}.story-intro{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,18,14,.58);backdrop-filter:blur(2px)}.story-intro.hidden{display:none}.story-card{width:min(620px,92vw);padding:28px;border:3px solid #c8a86a;background:#1d2d22;box-shadow:0 18px 50px rgba(0,0,0,.45);color:#f4ead2}.story-kicker{font:700 11px monospace;letter-spacing:.14em;opacity:.75}.story-card h2{margin:10px 0 12px;font:700 clamp(22px,5vw,38px) monospace}.story-card p{margin:0 0 22px;font:16px/1.55 system-ui,sans-serif;color:#e9dfc7}.story-next{border:0;padding:12px 18px;background:#c8a86a;color:#1b241c;font-weight:800;cursor:pointer}.story-intro:not(.hidden) .story-card{animation:storyIn .35s ease-out}@keyframes storyIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.vp-boot{position:fixed;inset:0;z-index:10000;background:#16231b;color:#f4ead2;display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif}.vp-boot.hidden{display:none!important}canvas{image-rendering:pixelated}</style></head><body>
<div class="vp-boot" id="bootScreen">VILLA PELÓN · INICIANDO EL MUNDO…</div>
<main id="app"><section id="start" class="intro-screen"></section><section id="game">

<div id="dialogue" class="dialogue hidden"><div id="speaker"></div><div id="dialogueText"></div><button id="dialogueNext" type="button">CONTINUAR</button></div>
<div class="touch" aria-label="Controles"><div class="touch-dpad"><button data-key="up" type="button">▲</button><button data-key="left" type="button">◀</button><button data-key="down" type="button">▼</button><button data-key="right" type="button">▶</button></div><button id="interact" type="button">E</button></div><button id="save" class="save" type="button">GUARDAR</button>
</section></main>
<section id="storyIntro" class="story-intro hidden"><div class="story-card"><div class="story-kicker">VILLA PELÓN · HISTORIA VIVA</div><h2 data-intro-title></h2><p data-intro-text></p><button class="story-next" data-intro-next>CONTINUAR</button></div></section>
