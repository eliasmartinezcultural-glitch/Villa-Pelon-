<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#294d38">
<meta name="description" content="Villa Pelón — RPG 2D pixel rural de mundo vivo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="./style.css?v=85">
<link rel="stylesheet" href="./v48_intro.css?v=85">
<style>
.vp-boot{position:fixed;inset:0;z-index:10000;background:#16231b;color:#f4ead2;display:flex;align-items:center;justify-content:center;font:700 14px/1.4 system-ui,sans-serif;letter-spacing:.08em}.vp-boot span{opacity:.8}.intro-screen{display:none!important}.vp-panel{max-height:88vh;overflow:auto}#vpMenuButton{z-index:50}body[data-graphics="low"] canvas,body[data-graphics="medium"] canvas,body[data-graphics="high"] canvas{image-rendering:pixelated}
</style>
</head>
<body>
<div class="vp-boot" id="bootScreen"><span>VILLA PELÓN · INICIANDO EL MUNDO…</span></div>
<main id="app">
<section id="start" class="screen intro-screen"><div class="title-card"><div class="eyebrow">OCARINA PRODUCCIONES · VILLA PELÓN</div><h1>VILLA PELÓN</h1><button id="startBtn" type="button">ENTRAR AL MUNDO</button></div></section>
<section id="game" class="hidden">
<header class="hud"><strong>VILLA PELÓN</strong><span>🕐 <b id="clock">08:00</b></span><span>📅 Día <b id="day">1</b></span><span>🌤️ <b id="weather">Despejado</b></span><span>💰 $<b id="money">10000</b></span><span>⚡ <b id="energy">100</b></span></header>
<canvas id="world" aria-label="Villa Pelón: exploración libre y pueblo vivo"></canvas>
<div class="quest"><b>MISIÓN</b><span id="questText">Explorá Villa Pelón.</span></div>
<div id="dialogue" class="dialogue hidden"><div id="speaker"></div><div id="dialogueText"></div><button id="dialogueNext" type="button">CONTINUAR</button></div>
<div class="touch" aria-label="Controles de movimiento"><div class="touch-dpad"><button data-key="up" type="button" aria-label="Mover arriba">▲</button><button data-key="left" type="button" aria-label="Mover izquierda">◀</button><button data-key="down" type="button" aria-label="Mover abajo">▼</button><button data-key="right" type="button" aria-label="Mover derecha">▶</button></div><button id="interact" type="button" aria-label="Interactuar">E</button></div>
<button id="save" class="save" type="button">GUARDAR</button>
</section>
</main>
<script src="./village_data.js?v=85" defer></script>
<script src="./core/runtime.js?v=85" defer></script>
<script src="./life.js?v=85" defer></script>
<script src="./life_routines_v68.js?v=85" defer></script>
<script src="./save_migration_v64.js?v=85" defer></script>
<script src="./controls.js?v=85" defer></script>
<script src="./game.js?v=85" defer></script>
<script src="./core/boot.js?v=85" defer></script>
<script src="./territory_expansion_v70.js?v=85" defer></script>
<script src="./v66_npc_consolidation.js?v=85" defer></script>
<script src="./interaction_context_v69.js?v=85" defer></script>
<script src="./interior_system_v71.js?v=85" defer></script>
<script src="./v57_integrity.js?v=85" defer></script>
<script src="./v50_version_badge.js?v=85" defer></script>
<script src="./v55_runtime_integrator.js?v=85" defer></script>
<script src="./ui_system.js?v=85" defer></script>
<script src="./v72_world_history.js?v=85" defer></script>
<script src="./v72_quest_ui.js?v=85" defer></script>
<script src="./v73_audit_stabilization.js?v=85" defer></script>
<script src="./v74_gameplay_spine.js?v=85" defer></script>
<script src="./v75_world_life_layer.js?v=85" defer></script>
<script src="./v76_character_social_layer.js?v=85" defer></script>
<script src="./v77_activity_system.js?v=85" defer></script>
<script src="./v82_boot_integrity.js?v=85" defer></script>
<script src="./v79_audit_stabilization.js?v=85" defer></script>
<script src="./v80_system_stabilization.js?v=85" defer></script>
<script src="./v83_world_integrity.js?v=85" defer></script>
<script>
window.addEventListener('villa-pelon-started',()=>{const b=document.getElementById('bootScreen');if(b)b.remove()});
setTimeout(()=>{const b=document.getElementById('bootScreen');if(b&&window.VillaPelon?.gameState?.started)b.remove()},5000);
</script>
</body>
</html>
